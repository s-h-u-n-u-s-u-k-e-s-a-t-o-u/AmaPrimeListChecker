<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ama Prime List Checker</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 260px;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #1f2937;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        background: #f59e0b;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #d97706;
      }
      p {
        margin: 12px 0 0;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <h1>Ama Prime List Checker</h1>
    <button id="start-check">Watch list を確認</button>
    <p>Amazon Prime のWatch listを開いて、未視聴の作品だけを残します。</p>
    <script src="popup.js"></script>
  </body>
</html>
